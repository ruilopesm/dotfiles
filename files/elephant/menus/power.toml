name = "power"
name_pretty = "Power"
global_search = false
fixed_order = true

[[entries]]
text = "Shutdown"
actions = { "select" = "systemctl poweroff" }

[[entries]]
text = "Reboot"
actions = { "select" = "systemctl reboot" }

[[entries]]
text = "Lock"
actions = { "select" = "hyprlock" }

[[entries]]
text = "Suspend"
actions = { "select" = "sync && systemctl suspend" }

[[entries]]
text = "Logout"
action = { "select" = "hyprctl dispatch exit" }
