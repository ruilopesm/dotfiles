general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

auth {
    fingerprint:enabled = false
}

background {
    monitor =
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 66
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.25 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    capslock_color = rgba(255, 82, 82, 0.9)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display, Noto Sans Black
    placeholder_text = <span foreground="##ffffff99">Password</span>
    fail_text = <span>Failed ($ATTEMPTS)</span>
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 130
    font_family = SF Pro Display, Noto Sans Black
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = SF Pro Display, Noto Sans Black
    position = 0, 105
    halign = center
    valign = center
}

image {
    monitor =
    path = $HOME/dotfiles/pictures/avatar.jpg
    border_color = 0xffdddddd
    border_size = 0
    size = 120
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, Rui
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = SF Pro Display, Noto Sans Black
    position = 0, -130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:300] grep -q 1 /sys/class/leds/*capslock/brightness && echo "CAPS LOCK ON" || echo "<span alpha='1'>.</span>"
    color = rgba(255, 82, 82, 0.90)
    font_size = 16
    font_family = SF Pro Display, Noto Sans Black
    position = 0, -285
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] m=$(( $(ps -o etimes= -p "$(pidof hyprlock)") / 60 )); [ "$m" -ge 1 ] && echo "Locked for $m min" || echo "Locked"
    color = rgba(216, 222, 233, 0.50)
    font_size = 14
    font_family = SF Pro Display, Noto Sans Black
    position = 0, 35
    halign = center
    valign = bottom
}
